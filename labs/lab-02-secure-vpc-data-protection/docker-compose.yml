services:
  localstack:
    image: localstack/localstack:3.8
    container_name: aws-saa-lab2
    ports:
      - "4567:4566"
    environment:
      - SERVICES=s3,kms
      - DEBUG=0
    volumes:
      - "./scripts/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh"
      - "localstack-data-lab2:/var/lib/localstack"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  alb:
    image: nginx:alpine
    container_name: lab2-alb
    ports:
      - "8080:80"
    volumes:
      - "./nginx.conf:/etc/nginx/nginx.conf:ro"
    depends_on:
      - app
    # The ALB must share a network with the app it proxies. Without this it
    # cannot resolve `app` and NGINX exits at start-up.
    networks:
      - default
      - private-net

  app:
    image: nginx:alpine
    container_name: lab2-app
    volumes:
      - "./app-index.html:/usr/share/nginx/html/index.html:ro"
    networks:
      - private-net

  db:
    image: mariadb:11
    container_name: lab2-db
    environment:
      MARIADB_ROOT_PASSWORD: RootPass123!
      MARIADB_DATABASE: labdb
      MARIADB_USER: app
      MARIADB_PASSWORD: AppPass123!
    networks:
      - isolated-net

networks:
  private-net:
    internal: true
  isolated-net:
    internal: true

volumes:
  localstack-data-lab2:
