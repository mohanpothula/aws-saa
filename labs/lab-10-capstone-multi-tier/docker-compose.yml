services:
  proxy:
    image: nginx:alpine
    container_name: lab10-proxy
    ports: ["8090:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
  app:
    build: .
    container_name: lab10-app
  db:
    image: mariadb:11
    container_name: lab10-db
    environment: ["MARIADB_ROOT_PASSWORD=Pass123!","MARIADB_DATABASE=appdb"]
  redis:
    image: redis:7-alpine
    container_name: lab10-redis
  minio:
    image: minio/minio
    container_name: lab10-minio
    command: server /data
    environment: ["MINIO_ROOT_USER=minioadmin","MINIO_ROOT_PASSWORD=minioadmin"]
